name: Continuous Quality Checks
on:
  push:

jobs:
  qlty:
    runs-on: ubuntu-latest
    steps:
      - run: echo '02 Attanasio - 🐧🐧🐧🐧🐧🐧'
      - run: tree
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: tree
      - run: curl https://qlty.sh | sh
      - run: ~/.qlty/bin/qlty init --no --skip-plugins
      - run: ~/.qlty/bin/qlty smells --all 
      - run: ~/.qlty/bin/qlty metrics --all --quiet
      - run: ~/.qlty/bin/qlty check --all -v