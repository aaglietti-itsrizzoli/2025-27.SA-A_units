name: Quality check
on:
  push:

jobs:
  qlty:
    runs-on: ubuntu-latest
    steps:
      - run: echo '07 Buongallino - 🐧🐧🐧🐧🐧🐧'
      - run: tree
      - name: Checkout repository code
        uses: actions/checkout@v4
      - run: tree
      - run: curl https://qlty.sh | sh
      - run: ~/.qlty/bin/qlty init --no
      - run: ~/.qlty/bin/qlty smells --all
      - run: ~/.qlty/bin/qlty metrics --all --quiet
      - run: ~/.qlty/bin/qlty check --all --verbose


