name: Continous quality checks!
on:
  push:

jobs:
  qlty:
    runs-on: ubuntu-latest
    steps:
      - run: echo '26 Roman - 🥷 🥷 🥷 🥷 🥷'
      - run: tree
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: tree
      - run: curl https://qlty.sh | sh
      - run: ~/.qlty/bin/qlty init --no --skip-plugins
      - run: ~/.qlty/bin/qlty smells --all
      - run: ~/.qlty/bin/qlty metrics --all --quiet
      - run: ~/.qlty/bin/qlty check